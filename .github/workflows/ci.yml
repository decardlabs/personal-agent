name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit and integration tests
        run: npm test

      - name: Replay regression tests
        run: npm run test:replay

      - name: Generate replay JSON summary
        run: npm run test:replay:report:json

      - name: Upload replay summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-summary
          path: reports/replay-summary.json
          if-no-files-found: warn
